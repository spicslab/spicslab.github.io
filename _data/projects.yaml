- title: SLOTHE
  subtitle: An Automatic Approximation for Non-Arithmetic Functions over Encrypted Data
  group: open-sourced
  image: images/papers/slothe.png
  link: https://github.com/SNUSOR-PECT/SLOTHE
  description: SLOTHE is an automatic workflow in generating efficient approximations for non-arithmetic functions over encrypted data. It offers programmability, where users can set their own constraints in the maximum approximation error and performance thresholds.
  repo: SNUSOR-PECT/SLOTHE
  tags:
    - PETs
    - compiler


- title: LOHEN
  subtitle: An Automatic Compiler that Optimizes the Performance and Accuracy of Neural Networks over FHE
  group: open-sourced
  image: images/papers/lohen.png
  link: https://github.com/SNUSOR-PECT/LOHEN_Public
  description: LOHEN offers a layer-wise optimization in generating FHE programs for neural networks. Taking a baseline FHE program as input, it analyzes the complicated cryptographic parameter options and suggests better options for performance and accuracy.
  repo: SNUSOR-PECT/LOHEN_Public
  tags:
    - PETs
    - compiler
